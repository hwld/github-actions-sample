name: Conditional CI

on:
  push:
  pull_request:

jobs:
  job1:
    name: Job 1
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check config file and decide success/failure
        run: |
          # config.txtファイルの内容をチェック
          config_value=$(cat config.txt | tr -d '[:space:]')
          echo "Config value: $config_value"
          
          if [ "$config_value" = "success" ]; then
            echo "✅ Job 1 succeeded (config.txt = success)"
            exit 0
          elif [ "$config_value" = "failure" ]; then
            echo "❌ Job 1 failed (config.txt = failure)"
            exit 1
          else
            echo "❌ Job 1 failed (unknown config value: $config_value)"
            exit 1
          fi

  check-results:
    name: Check Results
    runs-on: ubuntu-latest
    needs: [job1]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "=== Job Results ==="
          echo "Job1 result: ${{ needs.job1.result }}"
          echo "Event type: ${{ github.event_name }}"
          echo ""
          
          if [[ "${{ needs.job1.result }}" == "failure" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          
          echo "✅ All jobs succeeded"
