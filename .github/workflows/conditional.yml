name: Conditional Example

on:
  push:
  pull_request:

jobs:
  push-job:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Wait for a bit on push
        run: sleep 60

  pr-job:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Finish quickly on PR
        run: echo "PR job done"

  check-results-push:
    runs-on: ubuntu-latest
    needs: push-job
    if: github.event_name == 'push' && always()
    steps:
      - name: Report push job results
        run: |
          echo "push-job: ${{ needs.push-job.result }}"

          if [[ "${{ needs.push-job.result }}" == "failure" ]]; then
            echo "❌ push-job failed"
            exit 1
          fi

          echo "✅ push-job passed or was skipped"

  check-results-pr:
    runs-on: ubuntu-latest
    needs: pr-job
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: Report PR job results
        run: |
          echo "pr-job: ${{ needs.pr-job.result }}"

          if [[ "${{ needs.pr-job.result }}" == "failure" ]]; then
            echo "❌ pr-job failed"
            exit 1
          fi

          echo "✅ pr-job passed or was skipped"
