name: Conditional Example

on:
  push:
  pull_request:

jobs:
  push-job:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Wait for a bit on push
        run: sleep 20

  pr-job:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Finish quickly on PR
        run: echo "PR job done"

  check-results:
    runs-on: ubuntu-latest
    needs: [push-job, pr-job]
    if: always()
    steps:
      - name: Report job results
        run: |
          echo "push-job: ${{ needs.push-job.result }}"
          echo "pr-job: ${{ needs.pr-job.result }}"

          if [[ "${{ needs.push-job.result }}" == "failure" ]] || \
             [[ "${{ needs.pr-job.result }}" == "failure" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi

          echo "✅ All jobs passed or were skipped"
